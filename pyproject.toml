[project]
name = "f1-steward-explorer"
version = "0.1.0"
description = "Explore FIA Formula 1 steward decisions with authority- and date-aware retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pypdf>=5.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "loguru>=0.7",
    "rich>=13.7",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.28"]

[project.scripts]
steward = "steward.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steward"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D1"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
